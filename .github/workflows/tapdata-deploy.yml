name: TapData Deploy

on:
  push:
    branches: [main]
    paths:
      - '*_tapdata_export/**'
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - DEV
          - SIT
          - UAT
      project:
        description: 'Project name (留空则取 vars.PROJECT_NAME，再回落到仓库名)'
        required: false
        type: string
        default: ''

jobs:
  deploy:
    # TODO: Replace {WORKER_REPO} with actual org/repo, e.g. your-org/tapdata-cicd-worker
    uses: "bianziguai/tapdata-cicd-worker/.github/workflows/tapdata-deploy.yml@main"
    with:
      project: ${{ inputs.project || vars.PROJECT_NAME || github.event.repository.name }}
      target_env: ${{ inputs.target_env || '' }}
      caller_repo: ${{ github.repository }}
      caller_sha: ${{ github.sha }}
      caller_event: ${{ github.event_name }}
      caller_ref: ${{ github.ref }}
      worker_repo: "bianziguai/tapdata-cicd-worker"
    secrets:
      # 显式传递 GITHUB_TOKEN，让被调用的 workflow 能够认证
      GH_DEPLOY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DEV_TAPDATA_ACCESSCODE: ${{ secrets.DEV_TAPDATA_ACCESS_CODE }}
      SIT_TAPDATA_ACCESSCODE: ${{ secrets.SIT_TAPDATA_ACCESS_CODE }}
      UAT_TAPDATA_ACCESSCODE: ${{ secrets.UAT_TAPDATA_ACCESSCODE }}
